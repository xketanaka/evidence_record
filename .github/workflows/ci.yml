name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: test/fixtures/bsi
          key: bsi-vectors-${{ hashFiles('test/support/bsi_vectors.rb') }}
      - run: bundle exec rake test:fetch_vectors
      - run: bundle exec rake test

  # Interoperability tests with Bouncy Castle (docs/design.md, chapter 9).
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: interop/lib
          key: bouncy-castle-${{ hashFiles('test/support/bouncy_castle.rb') }}
      - run: bundle exec rake test:fetch_bouncy_castle
      - run: bundle exec rake test:interop
